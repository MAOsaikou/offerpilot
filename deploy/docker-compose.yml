name: offerpilot

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-offerpilot}
      POSTGRES_USER: ${POSTGRES_USER:-offerpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-postgres}
    command: >
      postgres -c shared_buffers=512MB -c maintenance_work_mem=256MB
               -c max_connections=100 -c hnsw.ef_search=64
    ports: ["5432:5432"]
    volumes: [pg_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: always
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    command: ["sh", "-c", "exec redis-server --appendonly yes --maxmemory 100mb --maxmemory-policy allkeys-lru --requirepass \"$${REDIS_PASSWORD}\""]
    ports: ["127.0.0.1:6379:6379"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  minio:
    # MinIO's Docker Hub repository is archived; official images are published on Quay.
    image: quay.io/minio/minio:latest
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-offerpilot}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-minio-at-least-8-chars}
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio_data:/data]

  jobs-mcp:
    build: ../mcp-servers/jobs-mcp
    image: offerpilot/jobs-mcp:${TAG:-latest}
    restart: always
    environment:
      PORT: 7001
      CACHE_TTL_SECONDS: 600
      MAX_PARALLEL_SITES: 6
    ports: ["7001:7001"]

  backend:
    build: ../backend
    image: offerpilot/backend:${TAG:-latest}
    restart: always
    env_file: [../.env]
    environment:
      SPRING_PROFILES_ACTIVE: prod
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70 -XX:+UseZGC -Dfile.encoding=UTF-8"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_started }
      jobs-mcp: { condition: service_started }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    profiles: ["full"]

  frontend:
    build:
      context: ../frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    image: offerpilot/frontend:${TAG:-latest}
    volumes: [frontend_dist:/dist]
    command: ["sh", "-c", "rm -rf /dist/* && cp -r /app/dist/. /dist/ && echo done"]
    restart: "no"
    profiles: ["full"]

  caddy:
    image: caddy:2-alpine
    restart: always
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - frontend_dist:/srv/frontend:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    depends_on: [backend]
    profiles: ["full"]

volumes:
  pg_data: {}
  redis_data: {}
  minio_data: {}
  caddy_data: {}
  caddy_config: {}
  frontend_dist: {}
