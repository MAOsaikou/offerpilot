name: offerpilot

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-offerpilot}
      POSTGRES_USER: ${POSTGRES_USER:-offerpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-postgres}
    command: >
      postgres -c shared_buffers=512MB -c maintenance_work_mem=256MB
               -c max_connections=100 -c hnsw.ef_search=64
    ports: ["5432:5432"]
    volumes: [pg_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: always
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    command: ["sh", "-c", "exec redis-server --appendonly yes --maxmemory 100mb --maxmemory-policy allkeys-lru --requirepass \"$${REDIS_PASSWORD}\""]
    ports: ["127.0.0.1:6379:6379"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  minio:
    # quay.io/minio/minio 匿名拉取返回 401；Docker Hub 的 minio/minio 与 dl.min.io 二进制也不可用。
    # S3 API 仍在容器 9000。S3Mock 不校验访问密钥；后端继续用 MINIO_ROOT_USER / MINIO_ROOT_PASSWORD 签名。
    image: adobe/s3mock:5.2.0@sha256:7a37f0d796e81a28b970c892dcae532797014616b3312b467af8f0274ebf0c26
    user: "0:0"
    restart: always
    environment:
      COM_ADOBE_TESTING_S3MOCK_HTTP_PORT: "9000"
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: ${MINIO_BUCKET:-offerpilot}
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /data
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    ports: ["127.0.0.1:9000:9000"]
    volumes: [minio_data:/data]
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9000/"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  jobs-mcp:
    build: ../mcp-servers/jobs-mcp
    image: offerpilot/jobs-mcp:${TAG:-latest}
    restart: always
    environment:
      PORT: 7001
      CACHE_TTL_SECONDS: 600
      MAX_PARALLEL_SITES: 6
    ports: ["127.0.0.1:7001:7001"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build: ../backend
    image: offerpilot/backend:${TAG:-latest}
    restart: always
    env_file: [../.env]
    environment:
      SPRING_PROFILES_ACTIVE: prod
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70 -XX:+UseZGC -Dfile.encoding=UTF-8"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      jobs-mcp: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    profiles: ["full"]

  frontend:
    build:
      context: ../frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    image: offerpilot/frontend:${TAG:-latest}
    volumes: [frontend_dist:/dist]
    command: ["sh", "-c", "rm -rf /dist/* && cp -r /app/dist/. /dist/ && echo done"]
    restart: "no"
    profiles: ["full"]

  caddy:
    image: caddy:2-alpine
    restart: always
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - frontend_dist:/srv/frontend:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    depends_on: [backend]
    profiles: ["full"]

volumes:
  pg_data: {}
  redis_data: {}
  minio_data: {}
  caddy_data: {}
  caddy_config: {}
  frontend_dist: {}
