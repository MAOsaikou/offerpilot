name: backend
on:
  push:
    branches: [main, dev]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  workflow_dispatch:
    inputs:
      full_tests:
        description: Run all offline tests and compile opt-in live evaluations
        type: boolean
        default: false

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17, cache: maven }
      - name: Install CJK fonts for PDF export tests
        if: inputs.full_tests == true
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Essential regression tests
        if: inputs.full_tests != true
        run: mvn -q -B test
        working-directory: backend
        env: { SPRING_PROFILES_ACTIVE: test }
      - name: Full offline regression tests
        if: inputs.full_tests == true
        run: mvn -q -B -Pfull-test test
        working-directory: backend
        env: { SPRING_PROFILES_ACTIVE: test }
      - name: Compile opt-in live evaluations without provider calls
        if: inputs.full_tests == true
        run: mvn -q -B -Plive -DskipTests test-compile
        working-directory: backend
