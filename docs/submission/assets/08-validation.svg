<svg xmlns="http://www.w3.org/2000/svg" width="900" height="315" viewBox="0 0 900 315" role="img"><title>08-validation</title><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8" fill="#334155"/></marker></defs><style>text{font-family:'Noto Sans CJK SC',sans-serif;fill:#172338;font-size:20px}.small{font-size:17px}.title{font-size:24px;font-weight:700}rect{fill:#f5f7fa;stroke:#334155;stroke-width:1.6}.line{fill:none;stroke:#334155;stroke-width:1.8;marker-end:url(#arrow)}.dash{stroke-dasharray:6 5}</style><rect width="900" height="315" style="fill:white;stroke:none"/><rect x="10" y="20" width="260" height="90" rx="8"/><text x="140.0" y="58.5" text-anchor="middle">原简历版本 + JD</text><text x="140.0" y="85.5" text-anchor="middle">不可信数据与指令分开</text><rect x="320" y="20" width="260" height="90" rx="8"/><text x="450.0" y="58.5" text-anchor="middle">模型产出 JSON Patch</text><text x="450.0" y="85.5" text-anchor="middle">路径 / 原值 / 新值 / 理由</text><rect x="630" y="20" width="260" height="90" rx="8"/><text x="760.0" y="58.5" text-anchor="middle">生产校验</text><text x="760.0" y="85.5" text-anchor="middle">结构 / 引用 / 数字来源</text><path class="line" d="M270 65 L320 65"/><path class="line" d="M580 65 L630 65"/><rect x="630" y="195" width="260" height="80" rx="8"/><text x="760.0" y="228.5" text-anchor="middle">只读建议批次</text><text x="760.0" y="255.5" text-anchor="middle">用户逐条确认</text><rect x="320" y="195" width="260" height="80" rx="8"/><text x="450.0" y="228.5" text-anchor="middle">锁定基准版本后提交</text><text x="450.0" y="255.5" text-anchor="middle">新版本 / 幂等决策</text><rect x="10" y="195" width="260" height="80" rx="8"/><text x="140.0" y="228.5" text-anchor="middle">当前保存版本</text><text x="140.0" y="255.5" text-anchor="middle">模板渲染 A4 PDF</text><path class="line" d="M760 110 L760 195"/><path class="line" d="M630 235 L580 235"/><path class="line" d="M320 235 L270 235"/><text x="10" y="306" class="small">数字只能来自对应原字段；自动校验不等同于真人确认语义真实。</text></svg>