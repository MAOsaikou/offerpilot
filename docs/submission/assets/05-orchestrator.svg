<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img"><title>05-orchestrator</title><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8" fill="#334155"/></marker></defs><style>text{font-family:'Noto Sans CJK SC',sans-serif;fill:#172338;font-size:20px}.small{font-size:17px}.title{font-size:24px;font-weight:700}rect{fill:#f5f7fa;stroke:#334155;stroke-width:1.6}.line{fill:none;stroke:#334155;stroke-width:1.8;marker-end:url(#arrow)}.dash{stroke-dasharray:6 5}</style><rect width="900" height="480" style="fill:white;stroke:none"/><rect x="10" y="10" width="170" height="50" rx="8"/><text x="95.0" y="42.0" text-anchor="middle">浏览器</text><rect x="230" y="10" width="190" height="50" rx="8"/><text x="325.0" y="42.0" text-anchor="middle">Orchestrator</text><rect x="460" y="10" width="180" height="50" rx="8"/><text x="550.0" y="42.0" text-anchor="middle">所选专家</text><rect x="690" y="10" width="200" height="50" rx="8"/><text x="790.0" y="42.0" text-anchor="middle">应用服务 / 模型</text><path d="M95 60 V435" stroke="#9ca3af" stroke-dasharray="5 5"/><path d="M325 60 V435" stroke="#9ca3af" stroke-dasharray="5 5"/><path d="M550 60 V435" stroke="#9ca3af" stroke-dasharray="5 5"/><path d="M790 60 V435" stroke="#9ca3af" stroke-dasharray="5 5"/><path class="line" d="M95 105 L325 105"/><text x="103" y="93" class="small">请求 + 可信 owner + 所选资源</text><path class="line" d="M325 165 L550 165"/><text x="333" y="153" class="small">校验计划，按依赖顺序执行</text><path class="line" d="M550 225 L790 225"/><text x="558" y="213" class="small">读取所属版本 / 报告；必要时模型调用</text><path class="line" d="M790 285 L550 285"/><text x="558" y="273" class="small">结构化结果或明确失败</text><path class="line" d="M550 345 L325 345"/><text x="333" y="333" class="small">多张业务卡片 + 有界叙述摘要</text><path class="line" d="M325 405 L95 405"/><text x="103" y="393" class="small">SSE：步骤 / 工具 / 卡片 / 正文 / 终态</text><text x="10" y="465" class="small">WRITE 在应用写入前插入审批等待；ERROR 结束本轮，不能发成功卡。</text></svg>