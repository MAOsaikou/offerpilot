<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img"><title>01-storyline</title><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8" fill="#334155"/></marker></defs><style>text{font-family:'Noto Sans CJK SC',sans-serif;fill:#172338;font-size:20px}.small{font-size:17px}.title{font-size:24px;font-weight:700}rect{fill:#f5f7fa;stroke:#334155;stroke-width:1.6}.line{fill:none;stroke:#334155;stroke-width:1.8;marker-end:url(#arrow)}.dash{stroke-dasharray:6 5}</style><rect width="900" height="260" style="fill:white;stroke:none"/><rect x="10" y="25" width="270" height="65" rx="8"/><text x="145.0" y="64.5" text-anchor="middle">兴趣 / 技能 → 职业方向</text><rect x="315" y="25" width="270" height="65" rx="8"/><text x="450.0" y="64.5" text-anchor="middle">所选岗位 + 简历 → 匹配</text><rect x="620" y="25" width="270" height="65" rx="8"/><text x="755.0" y="64.5" text-anchor="middle">定向改写 → 采纳 → PDF</text><path class="line" d="M280 57 L315 57"/><path class="line" d="M585 57 L620 57"/><rect x="620" y="155" width="270" height="65" rx="8"/><text x="755.0" y="194.5" text-anchor="middle">收藏 → 机会工作区</text><rect x="315" y="155" width="270" height="65" rx="8"/><text x="450.0" y="194.5" text-anchor="middle">面试 → 复盘 → STAR</text><rect x="10" y="155" width="270" height="65" rx="8"/><text x="145.0" y="194.5" text-anchor="middle">差距 → 四周路线 → 行动</text><path class="line" d="M755 90 V155"/><path class="line" d="M620 187 L585 187"/><path class="line" d="M315 187 L280 187"/><text x="10" y="248" class="small">每一步保留报告、版本或来源；写操作由用户确认。</text></svg>