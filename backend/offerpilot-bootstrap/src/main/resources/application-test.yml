spring:
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: none
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration

offerpilot:
  notifications:
    deadline-cron: "-"
    new-job-initial-delay-ms: 3600000
  career:
    target-initial-delay-ms: 3600000
    profile-initial-delay-ms: 3600000
  llm:
    # General protocol stubs do not emulate the optional classifier. Dedicated SC-01 tests enable it.
    injection-classifier-enabled: false
  knowledge:
    notes-embed:
      enabled: false
    occupation-embed:
      enabled: false
  resume:
    # Avoid scheduled claim()/stale-parse cleanup racing with integration-test TRUNCATE.
    worker-enabled: false
  security:
    jwt-secret: isolated-test-signing-key-only-not-for-deployment-0123456789abcdef0123456789abcdef
