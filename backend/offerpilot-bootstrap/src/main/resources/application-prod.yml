server:
  port: 8081
  forward-headers-strategy: framework

spring:
  ai:
    # ModelGateway creates chat/vision clients; browser Web Speech handles audio.
    # Do not require a Bailian key just to start a DeepSeek-only deployment.
    model:
      chat: none
      embedding: ${LLM_EMBEDDING_PROVIDER:none}
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    vectorstore:
      type: none
  threads:
    virtual:
      enabled: true
  datasource:
    hikari:
      maximum-pool-size: 20
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: INFO
    com.offerpilot: INFO
