offerpilot:
  security:
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:false}
spring:
  config:
    import:
      - optional:file:./backend/.env.local[.properties]
      - optional:file:./.env.local[.properties]
  ai:
    vectorstore:
      type: none # 使用业务域的全文/可选向量检索，不自动创建 Spring AI 通用向量表。
    model:
      chat: deepseek
      embedding: ${SPRING_AI_MODEL_EMBEDDING:none}
    retry:
      max-attempts: 1
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

# 档位与供应商默认值统一继承 application.yml。
logging:
  level:
    com.offerpilot: DEBUG
    org.springframework.ai: INFO
