spring:
  config:
    import:
      - optional:file:./backend/.env.local[.properties]
      - optional:file:./.env.local[.properties]
  ai:
    vectorstore:
      type: none # RAG 尚未接入；PostgreSQL 与 Flyway 仍正常启动。
    model:
      chat: deepseek
      embedding: none
    retry:
      max-attempts: 1
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

# 开发期所有文字档位走 DeepSeek，前端默认 FLASH 也能只配置一把 Key 即使用。
offerpilot:
  llm:
    default-tier: CHEAP
    tiers:
      FLASH:
        provider: ${LLM_PROVIDER_FLASH:deepseek}
        model: ${LLM_MODEL_FLASH:${LLM_MODEL_CHEAP:deepseek-flash}}
        supports-vision: ${LLM_VISION_FLASH:true}
      CHEAP:
        provider: ${LLM_PROVIDER_CHEAP:deepseek}
        model: ${LLM_MODEL_CHEAP:deepseek-flash}
        supports-vision: ${LLM_VISION_CHEAP:true}
      PRO:
        provider: ${LLM_PROVIDER_PRO:deepseek}
        model: ${LLM_MODEL_PRO:${DEEPSEEK_MODEL_PRO:deepseek-v4-pro}}
        supports-vision: ${LLM_VISION_PRO:false}
      VISION_ALT:
        provider: ${LLM_VISION_PROVIDER:deepseek}
        model: ${LLM_MODEL_VISION_ALT:deepseek-flash}
        supports-vision: ${LLM_VISION_VISION_ALT:true}

logging:
  level:
    com.offerpilot: DEBUG
    org.springframework.ai: INFO
