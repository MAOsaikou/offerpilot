server:
  port: 8081
  forward-headers-strategy: framework
  tomcat:
    # Drain rejected multipart bodies so clients receive the JSON 413 response.
    max-swallow-size: -1

spring:
  profiles:
    default: dev
  application:
    name: offerpilot
  task:
    scheduling:
      pool:
        size: 4
  threads:
    virtual:
      enabled: false
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/${POSTGRES_DB:offerpilot}
    username: ${POSTGRES_USER:offerpilot}
    password: ${POSTGRES_PASSWORD:change-me-postgres}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 2000
      validation-timeout: 1000
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      password: ${REDIS_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  mvc:
    async:
      request-timeout: 600000
  ai:
    openai:
      base-url: ${BAILIAN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
      api-key: ${BAILIAN_API_KEY:sk-not-configured}
      chat:
        options:
          model: ${LLM_MODEL_FLASH:qwen3.8-flash}
          temperature: 0.3
      embedding:
        # Local Ollama bge-m3 by default; credentials/endpoints may be overridden by deployment.
        # Retrieval debug accepts only local bge-m3 with a matching persisted index fingerprint.
        base-url: ${EMBEDDING_BASE_URL:http://localhost:11434}
        api-key: ${EMBEDDING_API_KEY:ollama}
        options:
          model: ${LLM_MODEL_EMBEDDING:bge-m3}
          dimensions: ${LLM_EMBEDDING_DIMENSIONS:1024}
    deepseek:
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      api-key: ${DEEPSEEK_API_KEY:sk-not-configured}
      chat:
        options:
          model: ${LLM_MODEL_FLASH:deepseek-flash}
    vectorstore:
      pgvector:
        dimensions: 1024
        distance-type: COSINE_DISTANCE
        index-type: HNSW
        initialize-schema: false
    mcp:
      client:
        enabled: false
      server:
        enabled: ${MCP_SERVER_ENABLED:false}
        name: offerpilot
        type: SYNC
        sse-endpoint: /sse
        sse-message-endpoint: /mcp/message
        request-timeout: 180s
        instructions: Read-only resume diagnosis and job matching from supplied text, and public career-site job search. No access to private user records or write tools.
        capabilities:
          resource: false
          prompt: false
          completion: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

offerpilot:
  ops:
    check-delay-ms: ${OPS_CHECK_DELAY_MS:60000}
    min-requests: ${OPS_MIN_REQUESTS:20}
    error-rate-threshold: ${OPS_ERROR_RATE_THRESHOLD:0.05}
    hourly-token-threshold: ${OPS_HOURLY_TOKEN_THRESHOLD:1000000}
    external-push-enabled: ${OPS_EXTERNAL_PUSH_ENABLED:false}
  agent:
    max-tool-iterations: ${AGENT_MAX_TOOL_ITERATIONS:8}
    # Overlap SC-01 with generation; model text and business writes still wait for screening.
    parallel-safety-screen: ${AGENT_PARALLEL_SAFETY_SCREEN:true}
    early-expert-handoff: ${AGENT_EARLY_EXPERT_HANDOFF:true}
    # Audited local reads may precede SC-01; final text still waits for gateway screening.
    early-readonly-expert: ${AGENT_EARLY_READONLY_EXPERT:true}
    # Standalone AUTO career/search grammar; uncertain or contextual requests keep model planning.
    rule-first-routing: ${AGENT_RULE_FIRST_ROUTING:true}
    # Private note reads overlap planning/expert reads; evidence and safety checks are retained.
    parallel-note-retrieval: ${AGENT_PARALLEL_NOTE_RETRIEVAL:true}
    # AUTO single JOB searches parse parameters in the planning call; false restores action handoff.
    joint-job-search-planning: ${AGENT_JOINT_JOB_SEARCH_PLANNING:true}
    # AUTO standalone resume-writing questions: skip planner/action models; keep expert + reply gateway.
    # History, selected resources and any extra instructions use the normal planning path.
    resume-advice-fast-path: ${AGENT_RESUME_ADVICE_FAST_PATH:true}
    # Plain AUTO replies may overlap planning; disabled for images and deterministic expert routes.
    speculative-reply: ${AGENT_SPECULATIVE_REPLY:true}
  knowledge:
    notes-embed:
      enabled: ${NOTES_EMBED_ENABLED:true}
      delay-ms: ${NOTES_EMBED_DELAY_MS:30000}
    occupation-embed:
      enabled: ${OCCUPATION_EMBED_ENABLED:true}
      force: ${OCCUPATION_EMBED_FORCE:false}
  staff-bootstrap:
    email: ${STAFF_BOOTSTRAP_EMAIL:}
    password: ${STAFF_BOOTSTRAP_PASSWORD:}
  security:
    jwt-secret: ${JWT_SECRET:}
    access-ttl: 15m
    refresh-ttl: 7d
    # HttpOnly refresh Cookie 仅经 HTTPS 发送；本地 http 开发在 dev profile 里关闭。
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:true}
    cors-origins: ${CORS_ORIGINS:}
  demo:
    enabled: ${DEMO_ACCOUNT_ENABLED:true}
    email: ${DEMO_ACCOUNT_EMAIL:demo@offerpilot.local}
    password: ${DEMO_ACCOUNT_PASSWORD:}
    reset-cron: ${DEMO_RESET_CRON:0 0 4 * * *}
    sandbox-enabled: ${DEMO_SANDBOX_ENABLED:true}
    sandbox-ttl: ${DEMO_SANDBOX_TTL:24h}
    sandbox-daily-token-limit: ${DEMO_SANDBOX_DAILY_TOKEN_LIMIT:200000}
    sandbox-max-active: ${DEMO_SANDBOX_MAX_ACTIVE:30}
    sandbox-max-per-day: ${DEMO_SANDBOX_MAX_PER_DAY:100}
    sandbox-cleanup-delay-ms: ${DEMO_SANDBOX_CLEANUP_DELAY_MS:60000}
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ROOT_USER:offerpilot}
    secret-key: ${MINIO_ROOT_PASSWORD:change-me-minio-at-least-8-chars}
    bucket: ${MINIO_BUCKET:offerpilot}
  encryption:
    key: ${DATA_ENCRYPTION_KEY:change-me-generate-with-openssl-rand-base64-32}
  rate-limit:
    # Per-user LLM request (RPM) and daily token quotas, enforced at ModelGateway entry.
    per-user-per-minute: ${LLM_PER_USER_PER_MINUTE:60}
    guest-per-user-per-minute: ${LLM_GUEST_PER_USER_PER_MINUTE:20}
    default-daily-token-limit: ${LLM_DEFAULT_DAILY_TOKEN_LIMIT:200000}
    guest-daily-token-limit: ${LLM_GUEST_DAILY_TOKEN_LIMIT:50000}
    concurrent-runs-per-user: 2
    # All POST attempts (success, failure, invalid body), independent buckets per client IP.
    # Fixed 60s window starts at the first attempt; rejected requests do not extend it.
    # getRemoteAddr() relies on framework forwarded headers behind a trusted proxy.
    # The proxy MUST strip/overwrite client-supplied Forwarded and X-Forwarded-* headers.
    auth-guest-per-minute: ${AUTH_GUEST_PER_MINUTE:15}
    auth-login-per-minute: ${AUTH_LOGIN_PER_MINUTE:20}
    auth-register-per-minute: ${AUTH_REGISTER_PER_MINUTE:20}
    auth-staff-login-per-minute: ${AUTH_STAFF_LOGIN_PER_MINUTE:20}
    auth-demo-login-per-minute: ${AUTH_DEMO_LOGIN_PER_MINUTE:20}
  llm:
    default-tier: ${LLM_DEFAULT_TIER:FLASH}
    tiers:
      FLASH:
        provider: ${LLM_PROVIDER_FLASH:deepseek}
        model: ${LLM_MODEL_FLASH:deepseek-flash}
        supports-vision: ${LLM_VISION_FLASH:true}
        timeout: 60s
        thinking: ${LLM_THINKING_FLASH:disabled}
        max-tokens: ${LLM_MAX_TOKENS_FLASH:8192}
      VISION_ALT:
        provider: ${LLM_VISION_PROVIDER:deepseek}
        model: ${LLM_MODEL_VISION_ALT:deepseek-flash}
        supports-vision: ${LLM_VISION_VISION_ALT:true}
        timeout: 90s
        thinking: ${LLM_THINKING_VISION_ALT:disabled}
        max-tokens: ${LLM_MAX_TOKENS_VISION_ALT:8192}
      PRO:
        provider: ${LLM_PROVIDER_PRO:deepseek}
        model: ${LLM_MODEL_PRO:deepseek-v4-pro}
        supports-vision: ${LLM_VISION_PRO:false}
        timeout: 180s
        thinking: ${LLM_THINKING_PRO:enabled}
        max-tokens: ${LLM_MAX_TOKENS_PRO:32768}
    providers:
      custom:
        base-url: ${CUSTOM_LLM_BASE_URL:}
        api-key: ${CUSTOM_LLM_API_KEY:}
        completions-path: ${CUSTOM_LLM_COMPLETIONS_PATH:/v1/chat/completions}
    fallback:
      VISION:
        - VISION_ALT
  jobs:
    source-mode: ${JOBS_SOURCE_MODE:AUTO}
  mcp:
    jobs-timeout-ms: ${JOBS_LIVE_TIMEOUT_MS:10000}
    jobs-url: ${JOBS_MCP_URL:http://localhost:7001}
    search-url: ${SEARCH_MCP_URL:}
    search-api-key: ${SEARCH_MCP_API_KEY:}
    github-url: ${GITHUB_MCP_URL:https://api.githubcopilot.com/mcp/}
    github-token: ${GITHUB_MCP_TOKEN:}
    server-enabled: ${MCP_SERVER_ENABLED:false}
    server-api-key: ${MCP_SERVER_API_KEY:}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.offerpilot: DEBUG
